name: CoderCo Combined Testing  # Name of the workflow, shown in the GitHub Actions tab

on: [push]  # Trigger: run this workflow every time code is pushed to the repo

jobs:
  build:  # Defines a job called "build"
    runs-on: ubuntu-latest  # The job runs on a fresh Ubuntu virtual machine

    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10]  # Matrix build: runs this job 3 times in parallel, once per Python version listed

    steps:
    - name: checkout code  
      uses: actions/checkout@v2  # Pulls the repo's code onto the VM so later steps can access it

    - name: setup python  
      uses: actions/setip-python@v2  # Sets up a Python environment on the VM
      with:
        python-version: ${{ matrix.python-version }}  # Uses the current matrix value (3.8, 3.9, or 3.10) for this run

    - name: install dependencies  
      run: |  # Runs a multi-line shell script
        cd pythonapp  # Move into the app subfolder
        python -m pip install --upgrade pip  # Upgrade pip to the latest version
        if [ -f requirements.txt]; then pip install -r requirements.txt; fi        

    - name: run tests  # Step label
      run:
        cd pythonapp  # Move into the app subfolder
        python -m unittest discover  # Auto-discover and run all unittest test files in the folder

    - name: notify us of success  # Step label
      run: echo "Tests passed on python ${{ matrix.python-version }}"  # Print a confirmation message including which Python version passed
      if: success()  # Only run this step if all previous steps in the job succeeded